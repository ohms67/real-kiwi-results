<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Real Kiwi Results</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="site-header">
    <a href="#" class="logo" data-nav="home">🥝 Real Kiwi Results</a>
    <button class="btn" data-nav="submit">Share a result</button>
  </header>

  <main>
    <!-- Home -->
    <section id="screen-home" class="screen">
      <h1>What worked for real Kiwis?</h1>
      <form id="search-form" class="search-form">
        <input id="search-input" type="text" placeholder="Search a problem, e.g. damp, tax, back pain">
        <select id="home-region" aria-label="Region"></select>
        <button class="btn" type="submit">Search</button>
      </form>
      <h2>Browse by category</h2>
      <div id="category-list" class="category-list"></div>
      <h2>Recent results</h2>
      <div id="recent-list" class="card-list"></div>
    </section>

    <!-- Results -->
    <section id="screen-results" class="screen hidden">
      <button class="link" data-nav="home">← Home</button>
      <h2 id="results-title"></h2>
      <label>Region <select id="results-region"></select></label>
      <div id="results-summary" class="summary"></div>
      <div id="results-list" class="card-list"></div>
    </section>

    <!-- Detail -->
    <section id="screen-detail" class="screen hidden">
      <button class="link" data-nav="back">← Back</button>
      <div id="detail-content" class="detail"></div>
    </section>

    <!-- Submit -->
    <section id="screen-submit" class="screen hidden">
      <h2>Share your result</h2>
      <form id="submit-form" class="form">
        <label>Region <select id="f-region" required></select></label>
        <label>Category <select id="f-category" required></select></label>
        <label>Problem <input id="f-problem" type="text" required></label>
        <label>Solution taken <textarea id="f-solution" rows="3" required></textarea></label>
        <label>Cost (NZD) <input id="f-cost" type="number" min="0" step="1" required></label>
        <label>Result achieved <textarea id="f-outcome" rows="3" required></textarea></label>
        <fieldset>
          <legend>Would you recommend it?</legend>
          <label><input type="radio" name="recommend" value="yes" checked> Yes</label>
          <label><input type="radio" name="recommend" value="no"> No</label>
        </fieldset>
        <label>Rating (1-5) <input id="f-rating" type="number" min="1" max="5" value="5" required></label>
        <button class="btn" type="submit">Submit</button>
      </form>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
